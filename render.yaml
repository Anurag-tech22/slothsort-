services:
  - type: web
    name: slothsort
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DEMO_MODE
        value: "true"            # sample files only, never real files
      - key: LLM_BACKEND
        value: gemini            # Gemma served by Google; the local-first version uses LM Studio
      - key: GEMMA_MODEL
        value: gemma-4-31b-it    # check the exact name in Google AI Studio
      - key: GOOGLE_API_KEY
        sync: false              # Render will ask you for it
