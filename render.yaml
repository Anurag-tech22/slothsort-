services:
  - type: web
    name: slothsort
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DEMO_MODE
        value: "true"            # Runs on sample demo files only
      - key: LLM_BACKEND
        value: heuristic         # Works out of the box with zero external keys; switch to 'gemini' if you supply GOOGLE_API_KEY
      - key: GEMMA_MODEL
        value: gemma-2-2b-it     # Google AI Studio Gemma model
      - key: GOOGLE_API_KEY
        sync: false              # Optional: Add your free Google AI Studio key if using LLM_BACKEND=gemini
