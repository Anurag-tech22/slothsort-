<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slothsort — Channel Your Inner Sloth with Local Gemma AI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🦥%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg-radial: radial-gradient(circle at top right, rgba(16, 185, 129, 0.12), transparent 45%),
               radial-gradient(circle at top left, rgba(139, 92, 246, 0.08), transparent 40%),
               #090d12;
  --bg: #090d12;
  --card-bg: rgba(18, 24, 34, 0.82);
  --card-border: rgba(255, 255, 255, 0.09);
  --card-hover: rgba(26, 36, 50, 0.9);
  --ink: #f1f5f9;
  --ink-secondary: #94a3b8;
  --muted: #64748b;
  --line: rgba(255, 255, 255, 0.08);
  --accent: #10b981;
  --accent-glow: rgba(16, 185, 129, 0.28);
  --accent-ink: #042f1a;
  --primary-btn: linear-gradient(135deg, #10b981 0%, #059669 100%);
  --amber: #f59e0b;
  --amber-bg: rgba(245, 158, 11, 0.12);
  --amber-border: rgba(245, 158, 11, 0.35);
  --red: #ef4444;
  --red-bg: rgba(239, 68, 68, 0.12);
  --blue: #3b82f6;
  --blue-bg: rgba(59, 130, 246, 0.14);
  --ok-bg: rgba(16, 185, 129, 0.15);
  --focus: #3b82f6;
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 10px 30px rgba(0, 0, 0, 0.4);
  --shadow-glow: 0 0 25px rgba(16, 185, 129, 0.18);
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg-radial: radial-gradient(circle at top right, rgba(16, 185, 129, 0.1), transparent 45%),
                 radial-gradient(circle at top left, rgba(139, 92, 246, 0.08), transparent 35%),
                 #f8fafc;
    --bg: #f8fafc;
    --card-bg: rgba(255, 255, 255, 0.9);
    --card-border: rgba(226, 232, 240, 0.9);
    --card-hover: #ffffff;
    --ink: #0f172a;
    --ink-secondary: #475569;
    --muted: #64748b;
    --line: #e2e8f0;
    --accent: #059669;
    --accent-glow: rgba(5, 150, 105, 0.2);
    --accent-ink: #ffffff;
    --primary-btn: linear-gradient(135deg, #059669 0%, #047857 100%);
    --amber: #d97706;
    --amber-bg: #fef3c7;
    --amber-border: #fde68a;
    --red: #dc2626;
    --red-bg: #fee2e2;
    --blue: #2563eb;
    --blue-bg: #dbeafe;
    --ok-bg: #d1fae5;
    --shadow-sm: 0 1px 4px rgba(0, 0, 0, 0.06);
    --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.08);
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100vh; }
body {
  background: var(--bg-radial);
  background-attachment: fixed;
  color: var(--ink);
  font: 14.5px/1.6 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
  -webkit-font-smoothing: antialiased;
}

.wrap {
  max-width: 1060px;
  margin: 0 auto;
  padding: 36px 24px 80px;
}

/* Header & Brand */
header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
  margin-bottom: 24px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 16px;
}
.logo-icon {
  font-size: 42px;
  line-height: 1;
  filter: drop-shadow(0 6px 12px rgba(0,0,0,0.35));
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  cursor: pointer;
  user-select: none;
}
.logo-icon:hover {
  transform: rotate(-10deg) scale(1.15);
}
h1 {
  font-size: 32px;
  line-height: 1.1;
  margin: 0;
  letter-spacing: -0.03em;
  font-weight: 800;
  background: linear-gradient(135deg, var(--ink) 30%, var(--accent) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.tag {
  color: var(--ink-secondary);
  margin: 6px 0 0;
  max-width: 62ch;
  font-size: 14px;
  line-height: 1.5;
}
.tag b {
  color: var(--accent);
}

/* Status Chips */
.chips {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}
.chip {
  display: inline-flex;
  align-items: center;
  border: 1px solid var(--card-border);
  background: var(--card-bg);
  backdrop-filter: blur(12px);
  border-radius: 999px;
  padding: 5px 14px;
  font-size: 13px;
  color: var(--ink-secondary);
  box-shadow: var(--shadow-sm);
  transition: all 0.2s ease;
}
.chip b {
  color: var(--ink);
  font-weight: 600;
  margin-left: 4px;
}
.chip:hover {
  border-color: var(--accent);
}

.dot {
  display: inline-block;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  margin-right: 8px;
  box-shadow: 0 0 8px currentColor;
}
.dot.online { background: #10b981; color: #10b981; }
.dot.degraded { background: var(--amber); color: var(--amber); }
.dot.offline, .dot.rules { background: var(--red); color: var(--red); }

/* Quick Metrics Cards */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
  margin: 24px 0 20px;
}
.stat-card {
  background: var(--card-bg);
  backdrop-filter: blur(14px);
  border: 1px solid var(--card-border);
  border-radius: var(--radius-md);
  padding: 18px 20px;
  box-shadow: var(--shadow-sm);
  transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
}
.stat-card:hover {
  transform: translateY(-2px);
  border-color: rgba(255, 255, 255, 0.18);
  box-shadow: var(--shadow-md);
}
.stat-label {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 6px;
}
.stat-value {
  font-size: 26px;
  font-weight: 800;
  margin-top: 4px;
  color: var(--ink);
  letter-spacing: -0.02em;
  font-family: 'JetBrains Mono', monospace;
}
.stat-sub {
  font-size: 12px;
  color: var(--ink-secondary);
  margin-top: 2px;
}

/* Banner Alert */
.banner {
  margin: 16px 0 20px;
  padding: 14px 18px;
  border-radius: var(--radius-md);
  background: var(--amber-bg);
  color: var(--ink);
  border: 1px solid var(--amber-border);
  font-size: 13.5px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: var(--shadow-sm);
}
.banner[hidden] {
  display: none !important;
}
.banner b {
  color: var(--amber);
  font-weight: 700;
}

/* Controls Toolbar */
.bar {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 18px;
}
button, select, input {
  font: inherit;
  color: inherit;
}
button {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--card-border);
  background: var(--card-bg);
  backdrop-filter: blur(12px);
  border-radius: var(--radius-sm);
  padding: 9px 16px;
  font-weight: 600;
  font-size: 13.5px;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: var(--shadow-sm);
}
button:hover:not(:disabled) {
  border-color: var(--accent);
  transform: translateY(-1px);
  box-shadow: var(--shadow-glow);
}
button:active:not(:disabled) {
  transform: translateY(0);
}
button.primary {
  background: var(--primary-btn);
  color: #ffffff;
  border: 1px solid transparent;
  box-shadow: 0 4px 14px var(--accent-glow);
}
button.primary:hover:not(:disabled) {
  filter: brightness(1.1);
  box-shadow: 0 6px 20px var(--accent-glow);
}
button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  transform: none !important;
  box-shadow: none !important;
}
:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

.toggle {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-left: auto;
  color: var(--ink-secondary);
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  user-select: none;
}
.toggle input[type=checkbox] {
  cursor: pointer;
  width: 17px;
  height: 17px;
  accent-color: var(--accent);
}

.search-box {
  position: relative;
  flex: 1;
  min-width: 240px;
}
input[type=search] {
  width: 100%;
  border: 1px solid var(--card-border);
  background: var(--card-bg);
  backdrop-filter: blur(12px);
  border-radius: var(--radius-sm);
  padding: 10px 16px 10px 38px;
  font-size: 14px;
  box-shadow: var(--shadow-sm);
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
input[type=search]:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
  outline: none;
}
.search-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
  font-size: 14px;
}
.search-kbd {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid var(--line);
  padding: 1px 6px;
  border-radius: 4px;
  color: var(--muted);
  pointer-events: none;
}

/* Action Rows List */
.list {
  border: 1px solid var(--card-border);
  border-radius: var(--radius-lg);
  background: var(--card-bg);
  backdrop-filter: blur(16px);
  overflow: hidden;
  box-shadow: var(--shadow-md);
}
.row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 14px 20px;
  padding: 18px 22px;
  border-top: 1px solid var(--line);
  transition: background 0.15s ease;
  align-items: center;
}
.row:first-child { border-top: 0; }
.row:hover {
  background: var(--card-hover);
}

.names { min-width: 0; }
.from {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--muted);
  overflow-wrap: anywhere;
  margin-bottom: 4px;
}
.to {
  font-weight: 700;
  font-size: 15.5px;
  overflow-wrap: anywhere;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}
.to .arrow {
  color: var(--muted);
  font-weight: 400;
  font-size: 13px;
}
.category-badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  background: var(--blue-bg);
  color: var(--blue);
  border: 1px solid rgba(59, 130, 246, 0.25);
}
.cat-Finance { background: var(--ok-bg); color: var(--accent); border-color: rgba(16, 185, 129, 0.3); }
.cat-Career { background: rgba(168, 85, 247, 0.15); color: #c084fc; border-color: rgba(168, 85, 247, 0.3); }
.cat-Study { background: rgba(99, 102, 241, 0.15); color: #818cf8; border-color: rgba(99, 102, 241, 0.3); }
.cat-Code { background: rgba(14, 165, 233, 0.15); color: #38bdf8; border-color: rgba(14, 165, 233, 0.3); }
.cat-Data { background: var(--amber-bg); color: var(--amber); border-color: var(--amber-border); }
.cat-Images { background: rgba(244, 63, 94, 0.15); color: #fb7185; border-color: rgba(244, 63, 94, 0.3); }
.cat-Installers { background: rgba(249, 115, 22, 0.15); color: #fb923c; border-color: rgba(249, 115, 22, 0.3); }
.cat-Archives { background: rgba(20, 184, 166, 0.15); color: #2dd4bf; border-color: rgba(20, 184, 166, 0.3); }

.meta {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
  margin-top: 8px;
  font-size: 13px;
  color: var(--ink-secondary);
}
.conf-wrapper {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-secondary);
}
.conf {
  width: 72px;
  height: 7px;
  border-radius: 999px;
  background: var(--line);
  overflow: hidden;
  display: inline-block;
  vertical-align: middle;
}
.conf i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, #10b981 0%, #34d399 100%);
  border-radius: 999px;
  transition: width 0.4s ease;
}
.conf.low i {
  background: linear-gradient(90deg, #f59e0b 0%, #fbbf24 100%);
}

.status {
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.s-proposed { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-border); }
.s-applied { background: var(--ok-bg); color: var(--accent); border: 1px solid rgba(16, 185, 129, 0.3); }
.s-undone, .s-skipped { background: rgba(255, 255, 255, 0.06); color: var(--muted); border: 1px solid var(--line); }

.reason-tag {
  font-size: 12px;
  color: var(--muted);
  font-style: italic;
}

.acts {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.acts select {
  border: 1px solid var(--card-border);
  background: var(--card-bg);
  border-radius: var(--radius-sm);
  padding: 7px 10px;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  cursor: pointer;
  transition: border-color 0.2s ease;
}
.acts select:hover {
  border-color: var(--accent);
}

.similar {
  grid-column: 1 / -1;
  font-size: 13px;
  color: var(--ink-secondary);
  border-top: 1px dashed var(--line);
  padding-top: 10px;
  margin-top: 4px;
}

.empty {
  padding: 56px 24px;
  text-align: center;
  color: var(--muted);
  font-size: 15px;
}
.empty-icon {
  font-size: 42px;
  display: block;
  margin-bottom: 12px;
  opacity: 0.8;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom, 0));
  transform: translateX(-50%) translateY(20px);
  background: #1e293b;
  color: #f8fafc;
  border: 1px solid rgba(255, 255, 255, 0.15);
  padding: 10px 20px;
  border-radius: 999px;
  font-size: 13.5px;
  font-weight: 600;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  opacity: 0;
  pointer-events: none;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  z-index: 1000;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
.toast.err {
  background: #7f1d1d;
  color: #fee2e2;
  border-color: #ef4444;
}

@media (max-width: 680px) {
  .row { grid-template-columns: 1fr; }
  .acts { justify-content: flex-start; }
  .toggle { margin-left: 0; }
  .stats-grid { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo-icon" aria-hidden="true">🦥</div>
      <div>
        <h1>Slothsort</h1>
      </div>
    </div>
    <div class="chips" id="chips" aria-label="Current setup"></div>
  </header>

  <div class="banner" id="banner" role="status" hidden></div>

  <!-- Interactive Stats Grid -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">📁 Files in Queue</div>
      <div class="stat-value" id="stat-queue">0</div>
      <div class="stat-sub" id="stat-queue-sub">Awaiting your approval</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">✨ Tidied Files</div>
      <div class="stat-value" id="stat-tidied">0</div>
      <div class="stat-sub">Moved safely with undo</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">⚡ Time Saved</div>
      <div class="stat-value" id="stat-saved">0 min</div>
      <div class="stat-sub">Effort spared by your sloth</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">🤖 Active Model</div>
      <div class="stat-value" id="stat-model" style="font-size: 20px; text-transform: uppercase;">Gemma 2B</div>
      <div class="stat-sub" id="stat-model-sub">100% offline & private</div>
    </div>
  </div>

  <p class="summary" id="summary" style="display:none;" aria-live="polite">Loading…</p>

  <div class="bar">
    <button class="primary" id="scan">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
      Scan folder
    </button>
    <button id="tidy">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      Approve all confident moves
    </button>
    <button id="seed" hidden>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      Add sample files
    </button>
    <label class="toggle">
      <input type="checkbox" id="dry">
      Review before moving (Safe Mode)
    </label>
  </div>

  <div class="bar">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="search" id="q" placeholder="Filter by name, category, or semantic keyword (e.g. invoice, resume, notes)..." aria-label="Search files">
      <span class="search-kbd">/</span>
    </div>
    <button id="clear" hidden>Clear search</button>
  </div>

  <div class="list" id="list" role="list"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = (id) => document.getElementById(id);
let STATE = null, SEARCH = "";

function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n[k] = v;
  }
  for (const kid of kids) n.append(kid);
  return n;
}

function toast(msg, bad) {
  const t = $("toast"); t.textContent = msg; t.classList.toggle("err", !!bad);
  t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 2800);
}

async function api(path, method = "GET", body) {
  const r = await fetch(path, { method, headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || ("Request failed (" + r.status + ")"));
  return data;
}

async function run(fn, okMsg) {
  try {
    const out = await fn();
    if (okMsg) toast(okMsg(out));
  } catch (e) {
    toast(e.message, true);
  }
  await refresh();
}

function renderState() {
  const s = STATE, st = s.stats || {};
  const chips = $("chips");
  const modelName = s.model.detail || s.model.backend;
  chips.replaceChildren(
    el("span", { class: "chip" }, el("span", { class: "dot " + s.model.status }), "Model: ", el("b", {}, modelName), " (" + s.model.status + ")"),
    el("span", { class: "chip" }, s.auto_watch ? "Watcher: Running" : "Watcher: Manual"),
  );

  const m = s.model, banner = $("banner");
  banner.hidden = m.status === "online";
  if (!banner.hidden) {
    const msg = {
      rules: "Local Gemma model is not running. Files will be sorted using keyword and extension rules.",
      offline: "Local model server unreachable at " + (s.llm_base_url || "localhost") + ". Falling back to rules.",
      degraded: "Model request failed; using rules fallback.",
    }[m.status] || m.detail;
    banner.replaceChildren(el("b", {}, m.status === "rules" ? "Rules Mode: " : "Notice: "), msg);
  }

  const waiting = st.proposed || 0, done = st.applied || 0;
  $("stat-queue").textContent = waiting;
  $("stat-queue-sub").textContent = waiting === 1 ? "1 file awaiting review" : `${waiting} files awaiting review`;
  $("stat-tidied").textContent = done;
  $("stat-saved").textContent = `${s.minutes_saved_estimate || 0} min`;
  $("stat-model").textContent = modelName.split("/").pop().replace(":latest", "");
  $("stat-model-sub").textContent = m.status === "online" ? "🟢 Localhost (Online)" : "🔴 Offline (Rules active)";

  $("summary").replaceChildren(
    el("strong", {}, waiting + (waiting === 1 ? " file" : " files")), " waiting for you. ",
    el("strong", {}, String(done)), " tidied, about ", el("strong", {}, (s.minutes_saved_estimate || 0) + " min"), " saved."
  );
  $("dry").checked = s.dry_run;
  $("seed").hidden = !s.demo_mode;
  $("tidy").disabled = waiting === 0;
}

function confBar(c) {
  const pct = Math.round(c * 100);
  const barWrapper = el("span", { class: "conf-wrapper", title: `Confidence ${pct}%` });
  const bar = el("span", { class: "conf" + (c < (STATE ? STATE.confidence_threshold : 0.6) ? " low" : "") }, el("i"));
  bar.firstChild.style.width = pct + "%";
  barWrapper.append(bar, el("span", {}, `${pct}%`));
  return barWrapper;
}

function renderRow(a) {
  const target = a.status === "applied" ? a.dst : (a.category + "/" + a.clean_name + (a.original_name.includes(".") ? a.original_name.slice(a.original_name.lastIndexOf(".")).toLowerCase() : ""));
  const row = el("div", { class: "row", role: "listitem" });
  
  const catBadge = el("span", { class: `category-badge cat-${a.category}` }, a.category);
  const toContent = el("div", { class: "to" }, 
    catBadge, 
    el("span", { class: "arrow" }, "→"), 
    el("span", { style: "font-family: 'JetBrains Mono', monospace; font-size: 14.5px;" }, target)
  );

  const cleanReason = (a.reason || "").replace(/ConnectError.*?ma\)/g, "offline").replace(/\(model unavailable, used rules.*?\)/g, "(rules fallback)");

  const names = el("div", { class: "names" },
    el("div", { class: "from" }, "Original: " + a.original_name),
    toContent,
    el("div", { class: "meta" },
      el("span", { class: "status s-" + a.status }, a.status === "proposed" ? "needs approval" : a.status),
      confBar(a.confidence),
      el("span", { class: "reason-tag" }, "via " + cleanReason)
    )
  );

  const acts = el("div", { class: "acts" });
  if (a.status === "proposed") {
    acts.append(
      el("button", { class: "primary", onclick: () => run(() => api(`/api/actions/${a.id}/approve`, "POST"), () => "Approved move") }, "✓ Approve"),
      el("button", { onclick: () => run(() => api(`/api/actions/${a.id}/skip`, "POST"), () => "Skipped") }, "Skip")
    );
  }
  if (a.status === "applied") {
    acts.append(el("button", { onclick: () => run(() => api(`/api/actions/${a.id}/undo`, "POST"), () => "Moved back") }, "↺ Undo"));
  }
  if (a.status === "proposed" || a.status === "applied") {
    const sel = el("select", { "aria-label": "Change category for " + a.original_name });
    STATE.categories.forEach((c) => sel.append(el("option", { value: c, selected: c === a.category }, c)));
    sel.addEventListener("change", () => run(() => api(`/api/actions/${a.id}/correct`, "POST", { category: sel.value }), () => "Category updated and learned!"));
    acts.append(sel);
  }
  const simBtn = el("button", { onclick: async () => {
    const existing = row.querySelector(".similar");
    if (existing) { existing.remove(); return; }
    try {
      const items = await api(`/api/actions/${a.id}/similar`);
      const box = el("div", { class: "similar" }, items.length ? "✨ Similar files: " : "No similar files indexed yet.");
      box.append(items.map((i) => i.original_name + " (" + i.category + ", " + Math.round(i.score * 100) + "%)").join(" • "));
      row.append(box);
    } catch (e) { toast(e.message, true); }
  } }, "Similar");
  acts.append(simBtn);

  row.append(names, acts);
  return row;
}

async function refresh() {
  STATE = await api("/api/state");
  renderState();
  const items = SEARCH ? await api("/api/search?q=" + encodeURIComponent(SEARCH)) : await api("/api/actions?limit=100");
  const list = $("list");
  list.replaceChildren();
  if (!items.length) {
    list.append(el("div", { class: "empty" }, 
      el("span", { class: "empty-icon" }, SEARCH ? "🔍" : "🦥"),
      SEARCH ? "No matching files found." : "No files pending. Put files in " + STATE.watch_dir + " and click 'Scan folder'."
    ));
  } else {
    items.forEach((a) => list.append(renderRow(a)));
  }
  $("clear").hidden = !SEARCH;
}

$("scan").onclick = () => run(() => api("/api/scan", "POST"), (r) => `${r.proposed} file(s) proposed, ${r.applied} applied`);
$("tidy").onclick = () => run(() => api("/api/actions/apply-confident", "POST"), (r) => `${r.applied} confident moves applied`);
$("seed").onclick = () => run(() => api("/api/demo/seed", "POST"), (r) => `${r.created} sample files created`);
$("dry").onchange = (e) => run(() => api("/api/mode", "POST", { dry_run: e.target.checked }));

let timer;
$("q").addEventListener("input", (e) => {
  clearTimeout(timer);
  timer = setTimeout(() => {
    SEARCH = e.target.value.trim();
    refresh();
  }, 200);
});
$("clear").onclick = () => {
  $("q").value = "";
  SEARCH = "";
  refresh();
};

// Keyboard Shortcuts: '/' to search, 'Esc' to clear
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== $("q")) {
    e.preventDefault();
    $("q").focus();
  } else if (e.key === "Escape" && document.activeElement === $("q")) {
    $("clear").click();
    $("q").blur();
  }
});

refresh().catch((e) => toast(e.message, true));
setInterval(() => {
  if (!SEARCH && document.visibilityState === "visible") refresh().catch(() => {});
}, 8000);
</script>
</body>
</html>
